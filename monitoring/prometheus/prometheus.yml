global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8084
          - user_service:8081
          - employee_service:8082
          - eureka-server:8761
          - config-server:8888
